[workspace]
resolver = "3"
members = ["core", "devices/beauty-r1"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/noctuum/klik-r1"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
evdev = "0.13.2"
nix = { version = "0.29", features = ["poll", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
udev = "0.9.3"
