[package]
name = "klik"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "klik"
path = "src/main.rs"

[features]
default = ["kwin", "script"]
kwin = ["dep:klik-kwin"]
script = ["dep:klik-script"]

[dependencies]
klik-core = { path = "../core" }
klik-linux = { path = "../platform/linux" }
klik-beauty-r1 = { path = "../devices/beauty-r1" }
klik-input = { path = "../modules/input" }
klik-kwin = { path = "../modules/kwin", optional = true }
klik-script = { path = "../modules/script", optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
