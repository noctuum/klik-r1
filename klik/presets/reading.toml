# Scroll with Up and Down, switch desktops with Left and Right.
[profiles.reading.bindings]
"beauty-r1.up:tap"    = { action = "input.wheel", direction = "up" }
"beauty-r1.down:tap"  = { action = "input.wheel", direction = "down" }
"beauty-r1.left:tap"  = { action = "kwin.desktop.prev" }
"beauty-r1.right:tap" = { action = "kwin.desktop.next" }
